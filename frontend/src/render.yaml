services:
  - type: web
    name: lunchpick-backend
    runtime: python
    rootDir: .
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: lunchpick-db
          property: connectionString

databases:
  - name: lunchpick-db
    databaseName: lunchpick_db
    user: lunchpick_user